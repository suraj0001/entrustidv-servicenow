# Entrust IDV for ServiceNow — Design & Architecture Document

---

## 1. Requirement & Problem Statement

### 1.1 The Business Problem
IT Service Desk and HR Help Desk teams are primary targets for identity impersonation and social engineering attacks (such as vishing or caller impersonation attacks like *Scattered Spider*). When employees contact the help desk requesting high-risk actions—such as **password resets, MFA device re-registration, account unlocks, or sensitive profile updates**—agents have traditionally relied on knowledge-based verification questions.

These traditional verification methods pose severe security risks:
* **Easily Bypassed Information:** Knowledge-based data (such as employee IDs, dates of birth, manager names, or security questions) is often leaked in data breaches, purchased on the dark web, or discovered on social media.
* **High Financial & Operational Impact:** A single unauthorized credential reset can give attackers complete access to enterprise networks, leading to devastating ransomware deployments and data theft.
* **Lack of Tamper-Proof Verification:** Help desk agents face intense pressure to resolve calls quickly and have lacked a fast, cryptographically verifiable, and tamper-proof way to confirm caller identity directly within their ServiceNow workflow.

### 1.2 The Solution
* A certified **ServiceNow Store Scoped Application** (`x_entru_entrustidv`).
* Allows service desk agents to initiate high-assurance identity verification with a single click directly from an **Incident** or **HR Case** record.
* **Entrust Identity Verification Platform Integration:** Leverages the Entrust Identity Verification platform (Smart Capture Link, Workflow Studio, and v3.6 REST APIs) without requiring custom backend middleware.
* **Email Delivery:** The verification link is delivered automatically and securely to the employee's registered email address.
* **Any-Device Access:** The end user can open the secure link on any internet-connected device with a camera and web browser (laptop, desktop, mobile phone, or tablet) to complete verification via government ID scanning and real-time biometric selfie with liveness detection.
* **Automated Record Synchronization:** Verification results post back automatically to ServiceNow, updating the ticket's verification status and logging detailed audit entries in the ticket's work notes.

## 2. Solution Flow & Architecture

### 2.1 Sequence Flow Diagram

```mermaid

    actor Agent as Service Desk Agent

    participant SN as ServiceNow Record (Incident / HR Case)
    participant Server as IDV Scoped App (Server)
    participant Entrust as Entrust IDV Platform

    Agent->>SN: Clicks "Verify Identity" UI Action
    SN->>Server: Start Verification (VerifyIdentityAjax)
    Server->>Entrust: Create Applicant & Start Workflow Run
    Entrust-->>Server: Return workflowRunId & Smart Link Expiry
    Server->>SN: Create Verification Request Record (active = true)

    and Primary Update (Webhook)
        Entrust->>Server: POST /webhook/events (HMAC-SHA256 Signed)

    and Secondary Update (Fallback Polling)

```

#### Step-by-Step Flow Details
* **1. Trigger Verification:** The service desk agent clicks the "Verify Identity" button on an Incident or HR Case.
* **2. Initiate Workflow:** ServiceNow calls the Entrust IDV REST API to create an applicant and generate a Smart Capture Link.
* **3. Email Delivery:** Entrust IDV platform sends an email containing the secure verification link directly to the employee's registered email.
* **4. Complete Verification:** The employee opens the link on any camera-enabled device (laptop, phone, or tablet) and submits their ID document and biometric selfie.
* **5. Webhook Notification (Primary):** Entrust IDV platform immediately dispatches an HMAC-SHA256 signed webhook event to ServiceNow upon status change.
* **6. Record & Work Notes Update:** ServiceNow validates the signature, updates the status field on the ticket, and logs an audit trail in the work notes.
* **7. Fallback Reconciliation:** If webhooks are delayed or blocked by network policies, ServiceNow client polling and server-side fallback sync with Entrust reconcile the status.

## 3. Dual-Channel Status Sync (Webhook + Fallback Polling)

To guarantee 100% reliable status delivery under all enterprise network conditions, the application implements a **dual-channel sync architecture**:

```mermaid
flowchart TD
    Start["Verification Triggered"] --> Init["Set status = 'In Progress'"]
    Init --> DualPath{"Dual Channel Sync"}

    subgraph PrimaryChannel["Primary: Webhook (Event-Driven)"]
        DualPath -->|Push| WH["Entrust sends POST to /webhook/events"]
        WH --> HMAC{"HMAC Signature Valid?"}
        HMAC -->|Yes| UpdateWH["Update DB & Post Work Note"]
        HMAC -->|No| RejectWH["Reject (401/403)"]
    end

    subgraph FallbackChannel["Fallback: Client Polling & Server Reconciliation"]
        DualPath -->|Poll| ClientPoll["Client Form Polling (GlideAjax)"]
        ClientPoll --> CheckGrace{"Past 60-min Grace Period<br/>or Link Expired?"}
        CheckGrace -->|No| ReturnLocal["Return Local DB Status"]
        CheckGrace -->|Yes| CheckThrottle{"Last Sync < 5 mins ago?"}
        CheckThrottle -->|Yes - Throttled| ReturnLocal
        CheckThrottle -->|No| CallAPI["Query Entrust API (GET /workflow_runs)"]
        CallAPI --> UpdateDB["Update DB & Post Work Note (if terminal)"]
    end

    UpdateWH --> Done["Final State (Approved / Declined / Review Required)"]
    UpdateDB --> Done
```

### 3.1 Primary Channel: Inbound Webhooks
* **Instantaneous & Event-Driven:** Entrust IDV platform sends status updates to the ServiceNow Scripted REST endpoint (`/webhook/events`) immediately as the workflow progresses.
* **Cryptographically Signed:** Every inbound payload is authenticated using an **HMAC-SHA256 signature** against the configured secret key.
* **Automatic Ticket Update:** On terminal status, the record is updated and an activity work note is posted to the ticket.

### 3.2 Fallback Channel: Client Polling & Smart Server Reconciliation
To ensure status updates even if network restrictions or firewall policies delay or block inbound webhooks:

* **Client-Side Adaptive Polling (`IdvStatusAjax`):**
  * **Initial Delays:**
    * **Trigger (Button Click):** **5-minute initial delay** before the first poll, giving the employee time to check their email and start verification.
    * **Form Load (`onLoad`):** **1-minute initial delay** if an active verification is already in progress.
  * **Two-Tier Polling Intervals:**
    * **Tier 1 (First 10 minutes):** Polls every **1 minute** for responsive initial updates.
    * **Tier 2 (10 to 60 minutes):** Polls every **5 minutes** to reduce unnecessary network traffic.
  * **Safety & Termination Limits:**
    * Polling stops immediately upon reaching any terminal state (`Approved`, `Declined`, `Review Required`, `Abandoned`, `Error`).
    * Polling terminates after a maximum duration of **60 minutes** or after **3 consecutive communication errors**.

* **Server-Side Grace Period & Outbound Throttling (`VerificationStatusService`):**
  * **60-Minute Grace Period:** During the first 60 minutes, the server trusts the inbound webhook channel and answers client polls using the local database, avoiding redundant outbound REST calls to Entrust.
  * **Smart Fallback Trigger:** If a request remains in a non-terminal state past the **60-minute grace period** or after the **Smart Capture Link expires**, the server doubts webhook delivery and initiates a direct outbound REST call (`GET /workflow_runs/{id}`) to Entrust.
  * **5-Minute Server Throttling:** Direct outbound REST checks to Entrust are throttled to at most **once every 5 minutes** per verification request (`last_status_sync`), preventing API rate exhaustion regardless of client polling frequency.
  * **Terminal State Reconciliation:** When Entrust reports a terminal state during fallback sync, ServiceNow updates the database and adds completion work notes to the ticket.

## 4. Re-Verification Flow

If an identity verification was previously performed on a ticket and needs to be repeated:

```mermaid
flowchart TD
    Click["Agent clicks 'Verify Identity'"] --> Check["Check active request on record"]
    Check --> HasPrior{"Prior status != 'Not Started'?"}
    HasPrior -->|Yes| ConfirmModal["Prompt Confirmation Modal:<br/>The verification request is already in progress.<br/>Do you want to create a new request?"]
    HasPrior -->|No| Proceed["Create New Verification"]
    ConfirmModal -->|No| Cancel["Abort (No changes)"]
    ConfirmModal -->|Yes| Deactivate["Deactivate prior request<br/>(active = false)"]
    Deactivate --> Proceed
    Proceed --> NewReq["Insert new request (active = true)<br/>Reset UI to 'In Progress'"]
```

* **Data Integrity:** Only **one** verification request is marked `active = true` per source record at any time.
* **Audit Trail:** Prior verification attempts remain in the verification request table for audit purposes (`active = false`).

### 5.1 Tables Summary
1. **`x_entru_entrustidv_configuration` (Custom Table):**
   * Stores global settings (Region, Workflow ID, Link Expiry, Delivery Channel, HMAC Signing Secret).
2. **`x_entru_entrustidv_verification_request` (Custom Table):**
   * Stores transaction logs linking ServiceNow records with Entrust workflow runs. Includes `active` boolean column for re-verification support.
3. **`incident` (Augmented Schema):**
   * Adds read-only column `x_entru_entrustidv_verification_status`.
4. **`sn_hr_core_case` (Augmented Schema):**
   * Adds read-only column `x_entru_entrustidv_verification_status`.

## 6. Security, Roles & Platform Governance

### 6.1 User Roles
* **`x_entru_entrustidv.admin`:**
  * Configures connection credentials, workflow settings, and webhook secret keys.
  * Access to Admin Setup UI Pages and full transaction history.
* **`x_entru_entrustidv.agent`:**
  * Triggers verification on Incident and HR Case records.
  * Views real-time verification status banners.
  * **No access** to API credentials or system configuration.

### 6.2 Security Controls
* **Encrypted Secrets:** Webhook secrets are stored using `Password2Column` (2-way encryption) preventing plain-text exposure.
* **HMAC Payload Verification:** Inbound webhook endpoint validates the SHA256 signature against raw payload bytes before any record processing.
* **Least-Privilege Cross-Scope Access:** Cross-scope privileges strictly scoped to reading target users (`sys_user`) and updating parent tickets (`incident`, `sn_hr_core_case`).
* **Connection & Credential Aliases:** Outbound REST uses ServiceNow standard Connection & Credential Aliases; no hardcoded API keys in script code.

---

## 7. Status Lifecycle & Values

The application uses clean, timestamp-free display statuses across server and client scripts:

| Status Value | Meaning | Action / Next Step |
| :--- | :--- | :--- |
| **Not Started** | No verification initiated for this ticket | "Verify Identity" button available |
| **Pending** / **In Progress** | Smart link sent; waiting for user completion | Fallback polling active |
| **In Process** | User currently uploading ID or completing selfie | Polling continues |
| **Approved** | Identity verification passed successfully | Work note added, polling stops |
| **Declined** | Identity verification failed / rejected | Work note added, polling stops |
| **Review Required** | Manual review needed in Entrust console | Alert shown to agent |
| **Abandoned** / **Error** | User closed link or process timed out | Error banner shown |
