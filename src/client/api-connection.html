<?xml version="1.0" encoding="utf-8"?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:g2="null">
  <style>html,
    body {
      overflow-y: auto !important;
      height: auto !important;
      margin: 0;
      padding: 0;
    }

    * {
      box-sizing: border-box;
    }

    .entrust-container {
      max-width: 900px;
      margin: 4px auto 24px;
      border: 1px solid #d7dce2;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .entrust-section {
      padding: 26px 42px 24px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-group label {
      display: block;
      margin-bottom: 3px;
      color: #202936;
      font-size: 15px;
      font-weight: 600;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #b9c1cc;
      border-radius: 5px;
      background: #ffffff;
      color: #303946;
      font-size: 14px;
      outline: none;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #4a7dbd;
      box-shadow: 0 0 0 2px rgba(74, 125, 189, 0.12);
    }

    .form-group input::placeholder {
      color: #9ba7b2;
    }

    .form-group input[readonly] {
      background: #f8f9fb;
      color: #55606f;
    }

    .hint {
      display: block;
      margin: 0 0 10px;
      color: #667180;
      font-size: 14px;
      line-height: 1.55;
    }

    .field-error {
      display: none;
      margin: 6px 0 0;
      color: #a12622;
      font-size: 13px;
      line-height: 1.4;
    }

    .form-group input[aria-invalid="true"],
    .form-group select[aria-invalid="true"] {
      border-color: #c83c3c;
      box-shadow: 0 0 0 2px rgba(200, 60, 60, 0.1);
    }

    .req {
      color: #c83c3c;
      margin-left: 2px;
    }

    .btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .btn {
      min-height: 42px;
      padding: 0 18px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button.btn-test {
      background: #f0f2f3 !important;
      background-image: none !important;
      border: 1px solid #aeb7bb !important;
      color: #29353B !important;
    }

    button.btn-test:hover {
      background: #e3e7e9 !important;
      border-color: #879399 !important;
    }

    button.btn-save {
      background: #4F52BD !important;
      background-image: none !important;
      border: 1px solid #4F52BD !important;
      color: #ffffff !important;
    }

    button.btn-save:hover {
      background: #3d40a0 !important;
      border-color: #3d40a0 !important;
    }

    button.btn-save:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-save-wrap {
      display: inline-block;
      cursor: not-allowed;
    }

    .btn-save-wrap button:disabled {
      pointer-events: none;
    }

    .status {
      display: none;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.4;
    }

    .status.success {
      background: #edf7f1;
      color: #326545;
      border: 1px solid #bdddc9;
    }

    .status.error {
      background: #fdf0f0;
      color: #9b3232;
      border: 1px solid #e5bcbc;
    }

    @media (max-width: 700px) {
      .entrust-container {
        margin: 4px 16px 24px;
      }

      .entrust-section {
        padding: 22px 22px 14px;
      }

      .btn-row {
        flex-wrap: wrap;
      }
    }</style>
  <div class="entrust-container">
    <div class="entrust-section">
      <div class="form-group">
        <label for="idv_region">Region
          <span class="req">*</span>
        </label>
        <select id="idv_region">
          <option value="">-- Select Region --</option>
          <option value="us">United States (US)</option>
          <option value="eu">Europe (EU)</option>
          <option value="ca">Canada (CA)</option>
        </select>
        <div class="field-error" id="idv_region_error" role="alert"></div>
      </div>
      <div class="form-group">
        <label for="idv_base_url">Base URL
          <span class="req">*</span>
        </label>
        <div class="hint">Auto-filled based on region</div>
        <input type="text" id="idv_base_url" readonly="true" placeholder="Auto-filled from region"></input>
      </div>
      <div class="form-group">
        <label for="idv_token_url">Token URL
          <span class="req">*</span>
        </label>
        <div class="hint">Auto-filled based on region</div>
        <input type="text" id="idv_token_url" readonly="true" placeholder="Auto-filled from region"></input>
      </div>
      <div class="form-group">
        <label for="idv_client_id">Client ID
          <span class="req">*</span>
        </label>
        <div class="hint" id="idv_client_id_hint">Enter the Client ID provided by Entrust</div>
        <input type="text" id="idv_client_id" maxlength="255" placeholder="Enter your Entrust Client ID"></input>
        <div class="field-error" id="idv_client_id_error" role="alert"></div>
      </div>
      <div class="form-group">
        <label for="idv_client_secret">Client Secret
          <span class="req">*</span>
        </label>
        <div class="hint" id="idv_client_secret_hint">Enter the Client Secret provided by Entrust</div>
        <input type="password" id="idv_client_secret" maxlength="255" placeholder="Enter your Entrust Client Secret"></input>
        <div class="field-error" id="idv_client_secret_error" role="alert"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-test" id="btn_test" type="button">Test Connection</button>
        <span class="btn-save-wrap" id="btn_save_wrap" title="Run a successful Test Connection to enable Save">
          <button class="btn btn-save" id="btn_save" type="button" disabled="true">Save</button>
        </span>
      </div>
      <div class="status" id="status_box"></div>
    </div>
  </div>
  <script src="./api-connection.client.js" type="module"></script>
</j:jelly>
