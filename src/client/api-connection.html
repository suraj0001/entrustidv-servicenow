<?xml version="1.0" encoding="utf-8"?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:g2="null">
    <style>
        html,
        body {
            overflow-y: auto !important;
            height: auto !important;
            margin: 0;
            padding: 0;
        }

        * {
            box-sizing: border-box;
        }

        .entrust-container {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 580px;
            margin: 4px auto;
            padding: 0 24px 24px;
            color: #2e3a45;
        }

        .entrust-section {
            background: #ffffff;
            border: 1px solid #dfe3e8;
            border-radius: 6px;
            padding: 24px;
            margin-bottom: 18px;
        }

        .section-title {
            margin: 0 0 5px;
            font-size: 16px;
            font-weight: 600;
            color: #253746;
        }

        .section-description {
            margin: 0 0 22px;
            font-size: 13px;
            line-height: 1.5;
            color: #73808c;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 7px;
            color: #34495e;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 38px;
            padding: 8px 11px;
            border: 1px solid #b8c2cc;
            border-radius: 4px;
            background: #ffffff;
            color: #263746;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #6d2077;
            box-shadow: 0 0 0 2px rgba(109, 32, 119, 0.12);
        }

        .form-group input::placeholder {
            color: #9ba7b2;
        }

        .form-group input[readonly] {
            background: #f3f5f7;
            color: #586773;
        }

        .hint {
            display: block;
            margin: 0 0 7px;
            font-size: 12px;
            color: #7b8792;
            line-height: 1.45;
        }

        .req {
            color: #c83c3c;
            margin-left: 2px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .btn {
            height: 40px;
            padding: 0 22px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button.btn-test {
            border: 1px solid #8e3a9d !important;
            background: #8e3a9d !important;
            background-image: none !important;
            color: #ffffff !important;
        }

        button.btn-test:hover {
            border-color: #732e80 !important;
            background: #732e80 !important;
            color: #ffffff !important;
        }

        button.btn-save {
            border: 1px solid #6d2077 !important;
            background: #6d2077 !important;
            background-image: none !important;
            color: #ffffff !important;
        }

        button.btn-save:hover {
            border-color: #561960 !important;
            background: #561960 !important;
            color: #ffffff !important;
        }

        button.btn-save:disabled {
            border-color: #aaa !important;
            background: #aaa !important;
            cursor: not-allowed;
        }

        .btn-save-wrap {
            display: inline-block;
            cursor: not-allowed;
        }

        .btn-save-wrap button:disabled {
            pointer-events: none;
        }

        .status {
            display: none;
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
        }

        .status.success {
            background: #edf7f1;
            color: #326545;
            border: 1px solid #bdddc9;
        }

        .status.error {
            background: #fdf0f0;
            color: #9b3232;
            border: 1px solid #e5bcbc;
        }

        @media (max-width: 640px) {
            .entrust-container {
                padding: 0 16px 24px;
            }

            .entrust-section {
                padding: 20px;
            }
        }
    </style>
    <div class="entrust-container">
        <div class="entrust-section">
            <div class="form-group">
                <label for="idv_region"
                    >Region
                    <span class="req">*</span>
                </label>
                <select id="idv_region">
                    <option value="">-- Select Region --</option>
                    <option value="us">United States (US)</option>
                    <option value="eu">Europe (EU)</option>
                    <option value="ca">Canada (CA)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="idv_base_url"
                    >Base URL
                    <span class="req">*</span>
                </label>
                <div class="hint">Auto-filled based on region</div>
                <input
                    type="text"
                    id="idv_base_url"
                    readonly="true"
                    placeholder="Auto-filled from region"
                />
            </div>
            <div class="form-group">
                <label for="idv_token_url"
                    >Token URL
                    <span class="req">*</span>
                </label>
                <div class="hint">Auto-filled based on region</div>
                <input
                    type="text"
                    id="idv_token_url"
                    readonly="true"
                    placeholder="Auto-filled from region"
                />
            </div>
            <div class="form-group">
                <label for="idv_client_id"
                    >Client ID
                    <span class="req">*</span>
                </label>
                <input
                    type="text"
                    id="idv_client_id"
                    maxlength="255"
                    placeholder="Enter your Entrust Client ID"
                />
            </div>
            <div class="form-group">
                <label for="idv_client_secret"
                    >Client Secret
                    <span class="req">*</span>
                </label>
                <div
                    id="idv_credentials_hint"
                    class="hint"
                    style="display: none; color: #0055a5"
                >
                    Credentials are already configured. Leave blank to keep
                    existing, or enter new values to update.
                </div>
                <input
                    type="password"
                    id="idv_client_secret"
                    maxlength="255"
                    placeholder="Enter your Entrust Client Secret"
                />
            </div>
            <div class="btn-row">
                <button class="btn btn-test" id="btn_test" type="button">
                    Test Connection
                </button>
                <span
                    class="btn-save-wrap"
                    id="btn_save_wrap"
                    title="Run a successful Test Connection to enable Save"
                >
                    <button
                        class="btn btn-save"
                        id="btn_save"
                        type="button"
                        disabled="true"
                    >
                        Save
                    </button>
                </span>
            </div>
            <div class="status" id="status_box"></div>
        </div>
    </div>
    <script src="./api-connection.client.js" type="module"></script>
</j:jelly>
