<?xml version="1.0" encoding="utf-8"?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:g2="null">
    <style id="entrust-setup-styles"></style>
    <div class="entrust-container api-connection-page">
        <div class="entrust-section">
            <div class="form-group">
                <label
                    >Region
                    <span class="req">*</span>
                </label>
                <select id="idv_region">
                    <option value="">-- Select Region --</option>
                    <option value="us">United States (US)</option>
                    <option value="eu">Europe (EU)</option>
                    <option value="ca">Canada (CA)</option>
                </select>
            </div>
            <div class="form-group">
                <label
                    >Base URL
                    <span class="req">*</span>
                </label>
                <input
                    type="text"
                    id="idv_base_url"
                    readonly="true"
                    placeholder="Auto-filled from region"
                />
                <div class="hint">Auto-filled based on region</div>
            </div>
            <div class="form-group">
                <label
                    >Token URL
                    <span class="req">*</span>
                </label>
                <input
                    type="text"
                    id="idv_token_url"
                    readonly="true"
                    placeholder="Auto-filled from region"
                />
                <div class="hint">Auto-filled based on region</div>
            </div>
            <div class="form-group">
                <label
                    >Client ID
                    <span class="req">*</span>
                </label>
                <input
                    type="text"
                    id="idv_client_id"
                    maxlength="255"
                    placeholder="Enter your Entrust Client ID"
                />
            </div>
            <div class="form-group">
                <label
                    >Client Secret
                    <span class="req">*</span>
                </label>
                <input
                    type="password"
                    id="idv_client_secret"
                    maxlength="255"
                    placeholder="Enter your Entrust Client Secret"
                />
                <div
                    id="idv_credentials_hint"
                    class="hint"
                    style="display: none; color: #0055a5"
                >
                    Credentials are already configured. Leave blank to keep
                    existing, or enter new values to update.
                </div>
            </div>
            <div class="btn-row">
                <button class="btn btn-test" id="btn_test" type="button">
                    Test Connection
                </button>
                <span
                    class="btn-save-wrap"
                    id="btn_save_wrap"
                    title="Run a successful Test Connection to enable Save"
                >
                    <button
                        class="btn btn-save"
                        id="btn_save"
                        type="button"
                        disabled="true"
                    >
                        Save
                    </button>
                </span>
            </div>
            <div class="status" id="status_box"></div>
        </div>
    </div>
    <script src="./api-connection.client.js" type="module"></script>
</j:jelly>
